<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diamond Nine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1 id="set-title">Diamond Nine</h1>
    <p id="set-instructions" class="instructions">
      Drag each card into the diamond below. The card you agree with most goes at the top,
      the one you agree with least at the bottom. Rearrange freely until you're happy, then submit.
    </p>
  </header>

  <main>
    <div class="board" id="board">
      <div class="pool" id="pool" aria-label="Unplaced cards"></div>
      <div class="diamond-area">
        <div class="diamond" id="diamond"></div>
      </div>
    </div>

    <div class="actions">
      <button id="submit-btn" type="button" disabled>Submit</button>
      <p id="submit-hint" class="hint">Place all 9 cards to enable submitting.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
